<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kickbase Dashboard</title>
    <link rel="stylesheet" href="node_modules\bootstrap\dist\css\bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="script.js"></script>
</head>
<body style="background-color: #131314;">
    <div id="loginForm" style="display: none;">
        <div class="login-box">
            <h2>Login</h2>
            <div class="user-box">
                <input type="email" id="email" placeholder="E-Mail" required>
            </div>
            <div class="user-box">
                <input type="password" id="password" placeholder="Passwort" required>
            </div>
            <button onclick="login()">Login</button>
        </div>
    </div>
    <div class="container" id="mainContent">
    </div>
</body>
<footer class="footer">
    <i class="fa-regular fa-thumbs-up" style="color: #25dc84;"></i> Starting XI
    <br>
    <i class="fa-solid fa-chair" style="color: #a8a8aa;"></i> Bench
    <br>
    <i class="fa-regular fa-thumbs-down" style="color: #f94c1f;"></i> Not in Squad
    <br>
    <i class="fa-solid fa-arrow-up" style="color: #25dc84;"></i> Subbed On
    <br>
    <i class="fa-solid fa-arrow-down" style="color: #f94c1f;"></i> Subbed Off
</footer>
</html>
